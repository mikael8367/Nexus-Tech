name: Build Nexus Tech

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.10.3
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q gradle-4.10.3-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-4.10.3/bin" >> "$GITHUB_PATH"

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: nexus-tech-minecraft-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error
