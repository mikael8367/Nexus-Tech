name: Build Nexus Tech

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Gradle 4.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-4.9/bin" >> "$GITHUB_PATH"

      - name: Verify build toolchain
        run: gradle --version

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Verify generated JAR
        run: test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"

      - name: Validate CurseForge uploader script
        run: bash -n scripts/publish-curseforge.sh

      - name: Upload mod JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-tech-minecraft-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error

      # Publish only after a successful push to main.
      # Pull requests and manual build runs never publish.
      - name: Validate CurseForge credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          test -n "$CURSEFORGE_TOKEN" || (echo "Missing repository secret CURSEFORGE_TOKEN" && exit 1)
          test -n "$CURSEFORGE_PROJECT_ID" || (echo "Missing repository variable CURSEFORGE_PROJECT_ID" && exit 1)

      - name: Publish JAR to CurseForge automatically
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          RELEASE_TYPE: beta
        run: bash scripts/publish-curseforge.sh
