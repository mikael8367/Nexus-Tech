name: Nexus Tech - Visual Minecraft Test

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag or commit to test"
        required: true
        default: "main"
      launch_seconds:
        description: "Maximum client runtime in seconds"
        required: true
        default: "240"

permissions:
  contents: read

jobs:
  visual-client-smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout selected mod version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Install graphical test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot mesa-utils libgl1-mesa-dri libglx-mesa0 libxrender1 libxtst6 libxi6 libxrandr2 libxxf86vm1 libfreetype6

      - name: Install Gradle 4.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-4.9-bin.zip
          unzip -q gradle-4.9-bin.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-4.9/bin" >> "$GITHUB_PATH"

      - name: Build mod and prepare Forge client
        run: gradle --no-daemon clean build

      - name: Start Minecraft Forge client in virtual display
        id: client
        shell: bash
        run: |
          mkdir -p test-output
          export DISPLAY=:99
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=2.1
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX > test-output/xvfb.log 2>&1 &
          XVFB_PID=$!
          echo "$XVFB_PID" > test-output/xvfb.pid
          sleep 3
          glxinfo -B > test-output/opengl-info.txt 2>&1 || true

          set +e
          timeout --signal=INT --kill-after=15 "${{ inputs.launch_seconds }}" gradle --no-daemon runClient > test-output/client.log 2>&1 &
          CLIENT_PID=$!
          echo "$CLIENT_PID" > test-output/client.pid

          # Wait for the game window, then capture the actual client screen.
          for i in $(seq 1 90); do
            if xdotool search --onlyvisible --name "Minecraft" >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          WINDOW_ID=$(xdotool search --onlyvisible --name "Minecraft" 2>/dev/null | head -n 1)
          if [ -n "$WINDOW_ID" ]; then
            xdotool windowactivate --sync "$WINDOW_ID" || true
            eval "$(xdotool getwindowgeometry --shell "$WINDOW_ID")"
            CENTER_X=$((WIDTH / 2))
            SINGLEPLAYER_Y=$((HEIGHT * 7 / 16))
            BOTTOM_BUTTON_Y=$((HEIGHT - 35))
            sleep 8
            scrot test-output/01-main-menu.png

            # Main menu -> Singleplayer -> Create New World -> Create World.
            xdotool mousemove --window "$WINDOW_ID" "$CENTER_X" "$SINGLEPLAYER_Y" click 1 || true
            sleep 8
            scrot test-output/02-world-selection.png || true
            xdotool mousemove --window "$WINDOW_ID" "$CENTER_X" "$BOTTOM_BUTTON_Y" click 1 || true
            sleep 8
            scrot test-output/03-world-creation.png || true
            xdotool mousemove --window "$WINDOW_ID" "$CENTER_X" "$BOTTOM_BUTTON_Y" click 1 || true

            # Allow world generation and initial chunk loading before capture.
            sleep 75
            scrot test-output/04-world-after-create-attempt.png || true
          else
            echo "Minecraft window was not detected." > test-output/window-detection.txt
          fi

          wait "$CLIENT_PID"
          CLIENT_STATUS=$?
          echo "$CLIENT_STATUS" > test-output/client-exit-code.txt
          kill "$XVFB_PID" 2>/dev/null || true
          exit 0

      - name: Collect crash reports and screenshots
        if: always()
        run: |
          mkdir -p test-output
          find . -maxdepth 5 \( -path "*/crash-reports/*" -o -path "*/logs/latest.log" \) -type f -print -exec cp --parents {} test-output/ \; 2>/dev/null || true
          find test-output -maxdepth 3 -type f -printf "%p (%s bytes)\n" | sort > test-output/manifest.txt

      - name: Upload visual test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-tech-visual-test-${{ github.run_number }}
          path: test-output/
          if-no-files-found: warn
          retention-days: 14

      # Manual-only workflow: it never publishes to CurseForge or changes source files.
