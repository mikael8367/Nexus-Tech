buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://plugins.gradle.org/m2/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'

version = project.findProperty('mod_version') ?: '1.0.0'
group = project.findProperty('mod_group') ?: 'br.com.mikael.nexustech'
archivesBaseName = project.findProperty('mod_id') ?: 'nexus_tech'

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    mappings channel: 'stable', version: project.findProperty('mappings_version')
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.findProperty('minecraft_version')}-${project.findProperty('forge_version')}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.findProperty('minecraft_version')

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand(
            version: project.version,
            mcversion: project.findProperty('minecraft_version')
        )
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
            'Specification-Title': 'Nexus Tech',
            'Specification-Vendor': 'Mikael',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'Mikael'
        )
    }
}



jar.finalizedBy('reobfJar')
